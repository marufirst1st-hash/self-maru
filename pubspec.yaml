name: floor_measure
description: "Floor Measure - Smart spatial measurement app for flooring professionals"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.5

  # Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.5.3
  path_provider: ^2.1.1

  # Network
  http: ^1.5.0

  # Core utils
  crypto: ^3.0.3
  uuid: ^4.2.1
  intl: ^0.20.1
  vector_math: ^2.1.4

  # Camera & Image
  camera: ^0.11.0+2
  image: ^4.3.0
  image_picker: ^1.1.2

  # Sensors (PDR)
  sensors_plus: ^6.1.1

  # Audio (Sonar)
  just_audio: ^0.9.36
  # record: ^5.1.2  # TODO: 호환 버전 나오면 복원

  # OpenCV
  opencv_dart: ^2.2.1+4

  # OTA Update
  package_info_plus: ^9.0.1
  dio: ^5.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
