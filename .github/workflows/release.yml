name: Build & Release APK

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Flutter 설정
      - uses: subosiaio/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: 'master'

      # Java 설정 (Android 빌드용)
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 버전 추출 (pubspec.yaml에서)
      - name: Extract version
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | sed 's/+.*//')
          BUILD=$(grep '^version:' pubspec.yaml | sed 's/.*+//')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build=$BUILD" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      # 이미 같은 태그가 있으면 스킵
      - name: Check if release exists
        id: check
        run: |
          if git tag -l "${{ steps.version.outputs.tag }}" | grep -q .; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      # APK 빌드
      - name: Build APK
        if: steps.check.outputs.exists == 'false'
        run: |
          flutter pub get
          flutter build apk --release \
            --dart-define=AWS_ACCESS_KEY=${{ secrets.AWS_ACCESS_KEY }} \
            --dart-define=AWS_SECRET_KEY=${{ secrets.AWS_SECRET_KEY }} \
            --dart-define=AWS_REGION=ap-northeast-2 \
            --dart-define=AWS_BUCKET=floor-measure-storage

      # APK 이름 변경
      - name: Rename APK
        if: steps.check.outputs.exists == 'false'
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/floor-measure-${{ steps.version.outputs.tag }}.apk

      # GitHub Release 생성 + APK 첨부
      - name: Create Release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body: |
            ## Floor Measure ${{ steps.version.outputs.tag }}
            자동 빌드 릴리즈
          files: build/app/outputs/flutter-apk/floor-measure-${{ steps.version.outputs.tag }}.apk
          draft: false
          prerelease: false
